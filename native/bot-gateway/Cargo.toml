[package]
name = "bot-gateway"
version = "0.1.0"
edition = "2021"
description = "Local gateway that runs the external poker bots (Sharingan, CFR-NLHE, Slumbot, fullhouse, poker_sequoia) behind one HTTP API for the Poker Table app."
license = "MIT"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"
ureq = { version = "2.10", default-features = false, features = ["json"] }
ctrlc = { version = "3.4", features = ["termination"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
