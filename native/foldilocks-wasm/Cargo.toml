[package]
name = "foldilocks-wasm"
version = "0.1.0"
edition = "2021"
description = "SIMD matrix-vector kernel for the in-app Foldilocks network (WebAssembly, embedded by scripts/ports/build_foldilocks_wasm.mjs)."
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
